<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Matrix Camera</title>
<style>
  :root { --c: #22ff66; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  video { display: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);
    background: linear-gradient(#000c, transparent); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .title { font-family: ui-monospace, Menlo, monospace; color: var(--c); text-shadow: 0 0 8px var(--c); letter-spacing: .15em; font-weight: 700; }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid #ffffff22; background: #0009; color: #fff; font-size: 20px; backdrop-filter: blur(8px); }
  .round:active { transform: scale(.92); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 12px; justify-items: center;
    padding: 18px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 12px);
    background: linear-gradient(transparent, #000d 35%); }
  .chips { display: flex; gap: 8px; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 0 4px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid #ffffff22; background: #0009; color: #ddd; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; white-space: nowrap; }
  .chip.on { border-color: var(--c); color: #000; background: var(--c); font-weight: 700; }
  .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #0000; padding: 0; }
  .dot.on { border-color: #fff; box-shadow: 0 0 12px currentColor; }
  .controls { display: flex; align-items: center; justify-content: space-between; width: min(100%, 440px); }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: var(--c); box-shadow: 0 0 24px var(--c); }
  .shutter:active { transform: scale(.92); }
  .thumb { width: 50px; height: 50px; border-radius: 12px; border: 2px solid #fff6; background: #111 center/cover; }
  input[type=range] { width: min(80vw, 320px); accent-color: var(--c); }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .flash.on { opacity: .8; transition: none; }
  .msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 30px; background: #000; z-index: 5; }
  .msg.show { display: grid; }
  .msg p { color: #aaa; max-width: 420px; line-height: 1.5; }
  .msg button { margin-top: 16px; border: 0; border-radius: 14px; padding: 14px 22px; font: inherit; font-weight: 700; background: var(--c); color: #000; }
  .gallery { position: fixed; inset: 0; background: #000e; z-index: 6; display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px); }
  .gallery.show { display: flex; }
  .gallery header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; overflow-y: auto; }
  .grid figure { margin: 0; position: relative; }
  .grid img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; display: block; }
  .grid button { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 50%; width: 30px; height: 30px; background: #000a; color: #fff; }
  .viewer { position: fixed; inset: 0; background: #000; z-index: 7; display: none; place-items: center; }
  .viewer.show { display: grid; }
  .viewer img { max-width: 100%; max-height: 100dvh; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="view"></canvas>
<div class="top">
  <span class="title">MATRIX CAM</span>
  <button class="round" id="flip" aria-label="Switch camera">⟲</button>
</div>
<div class="bottom">
  <div class="chips" id="modes"></div>
  <div class="chips" id="colors"></div>
  <input type="range" id="density" min="8" max="22" value="13" aria-label="Size">
  <div class="controls">
    <button class="thumb" id="thumb" aria-label="Gallery"></button>
    <button class="shutter" id="shot" aria-label="Capture"></button>
    <button class="round" id="pause" aria-label="Pause">❚❚</button>
  </div>
</div>
<div class="flash" id="flash"></div>
<div class="msg" id="msg"><div><h2 id="msgTitle"></h2><p id="msgText"></p><button id="retry"></button></div></div>
<div class="gallery" id="gallery">
  <header><b id="galTitle">Gallery</b><button class="round" id="closeGal">✕</button></header>
  <div class="grid" id="grid"></div>
</div>
<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = (en, es) => (ES ? es : en);
const kv = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v ?? d; } } catch (e) {} try { const v = localStorage.getItem('mx:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) return await Acornix.db.set(k, v); } catch (e) {} try { localStorage.setItem('mx:' + k, JSON.stringify(v)); } catch (e) {} },
};

const MODES = { matrix: 'Matrix', ascii: 'ASCII', dots: T('Halftone', 'Semitono') };
const COLORS = { green: '#22ff66', cyan: '#22e5ff', amber: '#ffb020', pink: '#ff4fd8' };
let mode = 'matrix', color = 'green', cell = 13, facing = 'user', paused = false;

const video = document.getElementById('video');
const view = document.getElementById('view');
const g = view.getContext('2d');
const sample = document.createElement('canvas');
const sg = sample.getContext('2d', { willReadFrequently: true });
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:=*+-<>¦'.split('');
const ASCII = ' .`:,;-~+=*ox#%@'.split('');

let cols = 0, rows = 0, dpr = 1, drops = [], chars = [];
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = Math.floor(innerWidth * dpr); view.height = Math.floor(innerHeight * dpr);
  cols = Math.ceil(innerWidth / cell); rows = Math.ceil(innerHeight / (cell * 1.15));
  sample.width = cols; sample.height = rows;
  drops = Array.from({ length: cols }, () => Math.random() * rows);
  chars = Array.from({ length: cols * rows }, () => GLYPHS[(Math.random() * GLYPHS.length) | 0]);
}

let stream = null;
async function start() {
  stopStream();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    document.getElementById('msg').classList.remove('show');
  } catch (e) {
    showMsg(T('Camera needed', 'Necesito la cámara'),
      T('Allow camera access to see yourself inside the Matrix. Nothing is uploaded: everything happens on your phone.',
        'Permite el acceso a la cámara para verte dentro de Matrix. No se sube nada: todo ocurre en tu móvil.'),
      T('Try again', 'Reintentar'));
  }
}
function stopStream() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }
function showMsg(title, text, btn) {
  document.getElementById('msgTitle').textContent = title;
  document.getElementById('msgText').textContent = text;
  document.getElementById('retry').textContent = btn;
  document.getElementById('msg').classList.add('show');
}
document.getElementById('retry').onclick = start;

// Draws the video "cover"-fitted into the small sampling canvas (mirrored for the selfie camera).
function sampleFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  const target = cols / (rows * 1.15), src = vw / vh;
  let sw = vw, sh = vh, sx = 0, sy = 0;
  if (src > target) { sw = vh * target; sx = (vw - sw) / 2; } else { sh = vw / target; sy = (vh - sh) / 2; }
  sg.save();
  if (facing === 'user') { sg.translate(cols, 0); sg.scale(-1, 1); }
  sg.drawImage(video, sx, sy, sw, sh, 0, 0, cols, rows);
  sg.restore();
  return sg.getImageData(0, 0, cols, rows).data;
}

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function render() {
  requestAnimationFrame(render);
  if (paused) return;
  const px = sampleFrame();
  const W = view.width, H = view.height, cw = cell * dpr, ch = cell * 1.15 * dpr;
  g.fillStyle = mode === 'matrix' ? 'rgba(0,0,0,0.55)' : '#000';
  g.fillRect(0, 0, W, H);
  if (!px) return;
  const [r0, g0, b0] = hexToRgb(COLORS[color]);
  g.font = `${Math.round(cw * 1.05)}px ui-monospace, Menlo, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let x = 0; x < cols; x++) {
    if (mode === 'matrix') { drops[x] += 0.35 + (x % 5) * 0.05; if (drops[x] > rows + 12) drops[x] = -Math.random() * 20; }
    for (let y = 0; y < rows; y++) {
      const i = (y * cols + x) * 4;
      let lum = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) / 255;
      lum = Math.min(1, Math.max(0, (lum - 0.08) * 1.35));
      const cx = x * cw + cw / 2, cy = y * ch + ch / 2;
      if (mode === 'matrix') {
        const d = drops[x] - y;
        const head = d >= 0 && d < 1 ? 1 : 0;
        const trail = d > 0 && d < 14 ? 1 - d / 14 : 0;
        const a = Math.min(1, lum * 0.95 + trail * 0.35);
        if (a < 0.06 && !head) continue;
        if (Math.random() < 0.02) chars[y * cols + x] = GLYPHS[(Math.random() * GLYPHS.length) | 0];
        g.fillStyle = head ? `rgba(220,255,230,${0.6 + lum * 0.4})` : `rgba(${r0},${g0},${b0},${a})`;
        g.fillText(chars[y * cols + x], cx, cy);
      } else if (mode === 'ascii') {
        const c = ASCII[Math.min(ASCII.length - 1, (lum * ASCII.length) | 0)];
        if (c === ' ') continue;
        g.fillStyle = `rgba(${r0},${g0},${b0},${0.35 + lum * 0.65})`;
        g.fillText(c, cx, cy);
      } else {
        const rad = lum * Math.min(cw, ch) * 0.55;
        if (rad < 0.6) continue;
        g.fillStyle = `rgb(${r0},${g0},${b0})`;
        g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill();
      }
    }
  }
}

// ---------- UI ----------
function renderChips() {
  const m = document.getElementById('modes'); m.innerHTML = '';
  Object.entries(MODES).forEach(([id, name]) => {
    const b = document.createElement('button'); b.className = 'chip' + (id === mode ? ' on' : ''); b.textContent = name;
    b.onclick = () => { mode = id; renderChips(); save(); }; m.appendChild(b);
  });
  const c = document.getElementById('colors'); c.innerHTML = '';
  Object.entries(COLORS).forEach(([id, hex]) => {
    const b = document.createElement('button'); b.className = 'dot' + (id === color ? ' on' : ''); b.style.background = hex; b.style.color = hex;
    b.setAttribute('aria-label', id);
    b.onclick = () => { color = id; document.documentElement.style.setProperty('--c', hex); renderChips(); save(); }; c.appendChild(b);
  });
  document.documentElement.style.setProperty('--c', COLORS[color]);
}
function save() { kv.set('settings', { mode, color, cell, facing }); }
document.getElementById('density').oninput = (e) => { cell = +e.target.value; resize(); save(); };
document.getElementById('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; save(); start(); };
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? '▶' : '❚❚'; };

// ---------- Snapshots (stored with Acornix.files) ----------
async function snapshot() {
  const flash = document.getElementById('flash'); flash.classList.add('on'); setTimeout(() => flash.classList.remove('on'), 60);
  try { window.Acornix ? Acornix.vibrate(30) : navigator.vibrate && navigator.vibrate(30); } catch (e) {}
  const blob = await new Promise((r) => view.toBlob(r, 'image/jpeg', 0.9));
  const name = `matrix-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.jpg`;
  if (window.Acornix) {
    try { const f = await Acornix.files.save(name, blob); setThumb(f.url); Acornix.toast(T('Saved to the gallery', 'Guardada en la galería')); } catch (e) {}
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  }
}
function setThumb(url) { document.getElementById('thumb').style.backgroundImage = url ? `url("${url}")` : ''; }
document.getElementById('shot').onclick = snapshot;

async function openGallery() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  let files = [];
  try { files = window.Acornix ? (await Acornix.files.list()).filter((f) => f.name.startsWith('matrix-')) : []; } catch (e) {}
  if (!files.length) grid.innerHTML = `<p style="color:#888">${T('Your captures will appear here.', 'Tus capturas aparecerán aquí.')}</p>`;
  files.forEach((f) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img alt=""><button aria-label="delete">✕</button>`;
    fig.querySelector('img').src = f.url;
    fig.querySelector('img').onclick = () => { document.getElementById('viewerImg').src = f.url; document.getElementById('viewer').classList.add('show'); };
    fig.querySelector('button').onclick = async () => { try { await Acornix.files.remove(f.name); } catch (e) {} openGallery(); refreshThumb(); };
    grid.appendChild(fig);
  });
  document.getElementById('gallery').classList.add('show');
}
async function refreshThumb() {
  try { if (!window.Acornix) return; const f = (await Acornix.files.list()).find((x) => x.name.startsWith('matrix-')); setThumb(f ? f.url : ''); } catch (e) {}
}
document.getElementById('thumb').onclick = openGallery;
document.getElementById('closeGal').onclick = () => document.getElementById('gallery').classList.remove('show');
document.getElementById('viewer').onclick = () => document.getElementById('viewer').classList.remove('show');
document.getElementById('galTitle').textContent = T('Gallery', 'Galería');

document.addEventListener('visibilitychange', () => { if (document.hidden) stopStream(); else start(); });
window.addEventListener('resize', resize);
(async () => {
  const s = await kv.get('settings', null);
  if (s) { mode = MODES[s.mode] ? s.mode : 'matrix'; color = COLORS[s.color] ? s.color : 'green'; cell = s.cell || 13; facing = s.facing || 'user'; }
  document.getElementById('density').value = cell;
  renderChips(); resize(); refreshThumb(); start(); render();
})();
</script>
</body>
</html>
