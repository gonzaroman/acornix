<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5c94fc">
<title>Super M</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; overscroll-behavior: none; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);
    font-weight: 800; font-size: clamp(13px, 3.4vmin, 18px); text-shadow: 0 2px 0 #0008; pointer-events: none; }
  .hud .grp { display: flex; gap: 14px; }
  .hud button { pointer-events: auto; border: 0; background: #0006; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 16px; }
  .pad { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; gap: 12px; }
  .pad.left { left: calc(env(safe-area-inset-left) + 14px); }
  .pad.right { right: calc(env(safe-area-inset-right) + 14px); }
  .pad button { width: clamp(64px, 17vmin, 92px); height: clamp(64px, 17vmin, 92px); border-radius: 50%; border: 2px solid #ffffff55;
    background: #00000040; color: #fff; font-size: clamp(22px, 6vmin, 32px); font-weight: 900; backdrop-filter: blur(4px); touch-action: none; }
  .pad button.on { background: #ffffff55; }
  .pad .jump { width: clamp(78px, 21vmin, 110px); height: clamp(78px, 21vmin, 110px); background: #e5252566; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #000a; padding: 24px; }
  .overlay.hide { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(36px, 10vmin, 64px); letter-spacing: .02em; text-shadow: 0 4px 0 #b91c1c, 0 8px 18px #0008; }
  .overlay p { margin: 6px 0; color: #ddd; font-size: 16px; }
  .overlay button { margin-top: 18px; border: 0; border-radius: 16px; padding: 14px 28px; font: inherit; font-weight: 800; font-size: 18px; background: #fbbf24; color: #3b1d00;
    box-shadow: 0 5px 0 #b45309; }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45309; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="grp"><span id="hLives">❤️ 3</span><span id="hCoins">🪙 0</span><span id="hLevel">🌍 1</span></div>
  <div class="grp"><span id="hScore">0</span><button id="pauseBtn" aria-label="Pause">❚❚</button></div>
</div>
<div class="pad left"><button id="bLeft" aria-label="Left">◀</button><button id="bRight" aria-label="Right">▶</button></div>
<div class="pad right"><button id="bJump" class="jump" aria-label="Jump">⤒</button></div>
<div class="overlay" id="overlay"><div>
  <h1>SUPER M</h1>
  <p id="oText"></p><p id="oBest"></p>
  <button id="oBtn"></button>
</div></div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = (en, es) => (ES ? es : en);
const kv = {
  async get(k, d) { try { if (window.Acornix) { const v = await Acornix.db.get(k); return v ?? d; } } catch (e) {} try { const v = localStorage.getItem('superm:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  async set(k, v) { try { if (window.Acornix) return await Acornix.db.set(k, v); } catch (e) {} try { localStorage.setItem('superm:' + k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- Sound ----------
let ac;
function beep(f0, f1, dur, type = 'square', vol = 0.12) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const SFX = {
  jump: () => beep(300, 700, 0.18), coin: () => { beep(988, 988, 0.07); setTimeout(() => beep(1319, 1319, 0.2), 70); },
  stomp: () => beep(400, 80, 0.15, 'triangle', 0.2), bump: () => beep(160, 90, 0.08, 'square', 0.1),
  power: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.1), i * 70)),
  hurt: () => beep(500, 60, 0.5, 'sawtooth', 0.12), win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.15, 'square', 0.1), i * 120)),
  brick: () => beep(220, 40, 0.2, 'sawtooth', 0.12),
};

// ---------- World ----------
const ROWS = 15, GROUND = 13;
const EMPTY = 0, SOLID = 1, BRICK = 2, QBLOCK = 3, USED = 4, PIPE = 5, STONE = 6;
let level = 1, W = 0, tiles, coins = [], enemies = [], items = [], particles = [], flagX = 0;

function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function buildLevel(n) {
  const r = rng(n * 7919 + 13);
  W = 170 + n * 25;
  tiles = new Uint8Array(W * ROWS);
  coins = []; enemies = []; items = []; particles = [];
  const set = (x, y, t) => { if (x >= 0 && x < W && y >= 0 && y < ROWS) tiles[y * W + x] = t; };
  const ground = (x) => { for (let y = GROUND; y < ROWS; y++) set(x, y, SOLID); };
  let x = 0;
  for (; x < 14; x++) ground(x);
  const end = W - 26;
  while (x < end) {
    const k = r();
    if (k < 0.18 && x > 18) {                         // gap
      const len = 2 + Math.floor(r() * Math.min(2 + n * 0.5, 4));
      for (let i = 0; i < 3; i++) coins.push({ x: x + len / 2 - 1 + i * 0.7, y: GROUND - 4 - Math.sin(i / 2 * Math.PI) * 1.5, got: false });
      x += len; for (let i = 0; i < 3; i++) ground(x++);
    } else if (k < 0.36) {                            // floating blocks with ? and bricks
      const len = 6 + Math.floor(r() * 6);
      for (let i = 0; i < len; i++) ground(x + i);
      const bx = x + 1 + Math.floor(r() * 2), bl = 3 + Math.floor(r() * 3), by = GROUND - 4;
      for (let i = 0; i < bl; i++) set(bx + i, by, r() < 0.35 ? QBLOCK : BRICK);
      if (r() < 0.5) set(bx + 1, by - 4, QBLOCK);
      if (r() < 0.6 + n * 0.05) enemies.push(makeEnemy(x + len - 2, GROUND - 1));
      x += len;
    } else if (k < 0.5) {                             // pipe
      const h = 2 + Math.floor(r() * Math.min(3, 1 + n));
      for (let i = 0; i < 6; i++) ground(x + i);
      for (let y = GROUND - h; y < GROUND; y++) { set(x + 2, y, PIPE); set(x + 3, y, PIPE); }
      if (r() < 0.5 + n * 0.08) enemies.push(makeEnemy(x + 5, GROUND - 1));
      x += 6;
    } else if (k < 0.62) {                            // stairs
      const h = 3 + Math.floor(r() * 2);
      for (let i = 0; i < h * 2 + 2; i++) ground(x + i);
      for (let i = 0; i < h; i++) for (let y = 0; y <= i; y++) set(x + i, GROUND - 1 - y, STONE);
      for (let i = 0; i < h; i++) for (let y = 0; y < h - i; y++) set(x + h + 2 + i, GROUND - 1 - y, STONE);
      x += h * 2 + 2;
    } else {                                          // flat with coins and enemies
      const len = 7 + Math.floor(r() * 8);
      for (let i = 0; i < len; i++) ground(x + i);
      const cy = GROUND - 2 - Math.floor(r() * 3);
      for (let i = 0; i < 4; i++) coins.push({ x: x + 2 + i, y: cy, got: false });
      const ne = Math.floor(r() * (1 + n * 0.6));
      for (let i = 0; i < ne; i++) enemies.push(makeEnemy(x + 3 + Math.floor(r() * (len - 4)), GROUND - 1, r() < 0.15 * n ? 'fast' : 'walk'));
      x += len;
    }
  }
  for (; x < W; x++) ground(x);
  // Final staircase and flag
  const s = W - 22;
  for (let i = 0; i < 8; i++) for (let y = 0; y <= i; y++) set(s + i, GROUND - 1 - y, STONE);
  flagX = W - 10;
  set(flagX, GROUND - 1, STONE);
}
function makeEnemy(x, y, kind = 'walk') { return { x, y, w: 0.9, h: 0.9, vx: kind === 'fast' ? -3.2 : -1.8, vy: 0, kind, alive: true, death: null, timer: 0 }; }
const tileAt = (x, y) => (x < 0 || x >= W ? SOLID : y < 0 || y >= ROWS ? EMPTY : tiles[(y | 0) * W + (x | 0)]);
const solid = (t) => t !== EMPTY;

// ---------- Player ----------
const P = { x: 2, y: GROUND - 1, w: 0.75, h: 0.95, vx: 0, vy: 0, onGround: false, big: false, inv: 0, face: 1, coyote: 0, jumpBuf: 0, dead: false, won: false };
let lives = 3, coinCount = 0, score = 0, best = 0, state = 'menu', camX = 0, time = 0;

function resetPlayer() {
  Object.assign(P, { x: 2, y: GROUND - 1, vx: 0, vy: 0, onGround: false, h: P.big ? 1.8 : 0.95, inv: 1.5, coyote: 0, jumpBuf: 0, dead: false, won: false });
  P.y = GROUND - P.h; camX = 0;
}

// Axis-separated tile collision
function moveBody(b, dt, onHitHead) {
  b.x += b.vx * dt;
  const top = Math.floor(b.y), bottom = Math.floor(b.y + b.h - 0.001);
  if (b.vx > 0) {
    const tx = Math.floor(b.x + b.w);
    for (let y = top; y <= bottom; y++) if (solid(tileAt(tx, y))) { b.x = tx - b.w; b.vx = b.bounce ? -Math.abs(b.vx) : 0; b.hitWall = true; break; }
  } else if (b.vx < 0) {
    const tx = Math.floor(b.x);
    for (let y = top; y <= bottom; y++) if (solid(tileAt(tx, y))) { b.x = tx + 1; b.vx = b.bounce ? Math.abs(b.vx) : 0; b.hitWall = true; break; }
  }
  b.y += b.vy * dt;
  const left = Math.floor(b.x), right = Math.floor(b.x + b.w - 0.001);
  b.onGround = false;
  if (b.vy > 0) {
    const ty = Math.floor(b.y + b.h);
    for (let x = left; x <= right; x++) if (solid(tileAt(x, ty))) { b.y = ty - b.h; b.vy = 0; b.onGround = true; break; }
  } else if (b.vy < 0) {
    const ty = Math.floor(b.y);
    for (let x = left; x <= right; x++) if (solid(tileAt(x, ty))) {
      b.y = ty + 1; b.vy = 0;
      // hit the block nearest to the body's center
      const cx = Math.floor(b.x + b.w / 2);
      if (onHitHead) onHitHead(solid(tileAt(cx, ty)) ? cx : x, ty);
      break;
    }
  }
}

function hitBlock(x, y) {
  const t = tileAt(x, y);
  if (t === QBLOCK) {
    tiles[y * W + x] = USED;
    if ((x * 31 + y * 17 + level) % 4 === 0 && !P.big) { items.push({ x: x + 0.1, y: y - 0.9, w: 0.8, h: 0.8, vx: 2, vy: -3, bounce: true, rise: 0.8 }); SFX.power(); }
    else { coinCount++; score += 200; particles.push({ kind: 'coin', x: x + 0.5, y: y - 0.5, vy: -9, t: 0.5 }); SFX.coin(); }
  } else if (t === BRICK) {
    if (P.big) {
      tiles[y * W + x] = EMPTY; score += 50; SFX.brick();
      for (let i = 0; i < 4; i++) particles.push({ kind: 'brick', x: x + 0.5, y: y + 0.5, vx: (i % 2 ? 1 : -1) * (2 + Math.random() * 2), vy: -8 - (i < 2 ? 4 : 0), t: 1.2 });
    } else SFX.bump();
    enemies.forEach((e) => { if (e.alive && Math.abs(e.x + e.w / 2 - (x + 0.5)) < 1 && Math.abs(e.y + e.h - y) < 0.3) killEnemy(e, true); });
  } else SFX.bump();
}
function killEnemy(e, flip) { e.alive = false; e.death = flip ? 'flip' : 'squash'; e.timer = flip ? 1 : 0.45; score += 100; SFX.stomp(); }

function hurt() {
  if (P.inv > 0 || P.dead) return;
  if (P.big) { P.big = false; P.y += P.h - 0.95; P.h = 0.95; P.inv = 2; SFX.hurt(); buzz(60); return; }
  die();
}
function die() {
  P.dead = true; P.vy = -14; P.vx = 0; SFX.hurt(); buzz(200);
  setTimeout(() => {
    lives--;
    if (lives <= 0) gameOver(); else { buildLevel(level); P.big = false; resetPlayer(); }
  }, 1600);
}
function buzz(ms) { try { window.Acornix ? Acornix.vibrate(ms) : navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- Input ----------
const input = { left: false, right: false, jump: false };
function bindHold(id, key) {
  const el = document.getElementById(id);
  const on = (e) => { e.preventDefault(); input[key] = true; el.classList.add('on'); if (key === 'jump') P.jumpBuf = 0.15; };
  const off = (e) => { e.preventDefault(); input[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindHold('bLeft', 'left'); bindHold('bRight', 'right'); bindHold('bJump', 'jump');
const KEYS = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'jump', w: 'jump', ' ': 'jump' };
addEventListener('keydown', (e) => { const k = KEYS[e.key]; if (k) { if (k === 'jump' && !input.jump) P.jumpBuf = 0.15; input[k] = true; e.preventDefault(); } });
addEventListener('keyup', (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });

// ---------- Update ----------
const GRAV = 38, MAXRUN = 7.5, ACC = 30, JUMP = 15.5, MAXFALL = 20;
function update(dt) {
  time += dt;
  if (P.won) { P.vx = 3; P.vy = Math.min(P.vy + GRAV * dt, MAXFALL); moveBody(P, dt); return; }
  if (P.dead) { P.vy += GRAV * dt; P.y += P.vy * dt; return; }
  P.inv = Math.max(0, P.inv - dt);
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir) { P.vx += dir * ACC * dt; P.face = dir; } else { P.vx *= Math.pow(0.0008, dt); if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  P.vx = Math.max(-MAXRUN, Math.min(MAXRUN, P.vx));
  P.coyote = P.onGround ? 0.1 : P.coyote - dt;
  P.jumpBuf -= dt;
  if (P.jumpBuf > 0 && P.coyote > 0) { P.vy = -JUMP; P.coyote = 0; P.jumpBuf = 0; SFX.jump(); }
  if (!input.jump && P.vy < -5) P.vy += GRAV * 1.8 * dt;   // short hop when released
  P.vy = Math.min(P.vy + GRAV * dt, MAXFALL);
  moveBody(P, dt, hitBlock);
  if (P.x < camX) { P.x = camX; P.vx = Math.max(0, P.vx); }
  if (P.y > ROWS + 1) die();

  // coins
  coins.forEach((c) => { if (!c.got && Math.abs(c.x + 0.5 - (P.x + P.w / 2)) < 0.7 && Math.abs(c.y + 0.5 - (P.y + P.h / 2)) < P.h / 2 + 0.3) { c.got = true; coinCount++; score += 100; SFX.coin(); } });
  // power-up items
  items.forEach((it) => {
    if (it.rise > 0) { it.rise -= dt; it.y -= dt * 1.1; return; }
    it.vy = Math.min(it.vy + GRAV * dt, MAXFALL); moveBody(it, dt);
    if (!it.got && overlap(it, P)) { it.got = true; if (!P.big) { P.big = true; P.y -= 0.85; P.h = 1.8; } score += 1000; SFX.power(); buzz(40); }
  });
  items = items.filter((it) => !it.got && it.y < ROWS + 2);
  // enemies
  enemies.forEach((e) => {
    if (!e.alive) { e.timer -= dt; return; }
    if (e.x > camX + viewCols + 3) return;      // asleep until close to the screen
    e.bounce = true; e.vy = Math.min(e.vy + GRAV * dt, MAXFALL); moveBody(e, dt);
    if (e.y > ROWS + 2) e.alive = false;
    if (overlap(e, P) && !P.dead) {
      if (P.vy > 2 && P.y + P.h - e.y < 0.6) { killEnemy(e); P.vy = input.jump ? -JUMP : -JUMP * 0.6; buzz(25); }
      else hurt();
    }
  });
  // particles
  particles.forEach((p) => { p.t -= dt; p.vy = (p.vy || 0) + GRAV * dt; p.y += p.vy * dt; p.x += (p.vx || 0) * dt; });
  particles = particles.filter((p) => p.t > 0);
  // goal
  if (P.x + P.w > flagX && !P.won) {
    P.won = true; score += 2000 + Math.max(0, Math.floor(300 - time)) * 10; SFX.win(); buzz(80);
    setTimeout(() => { level++; time = 0; buildLevel(level); resetPlayer(); saveBest(); }, 2400);
  }
  camX = Math.max(camX, Math.min(W - viewCols, P.x - viewCols * 0.4));
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- Render ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let TS = 32, viewCols = 20, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const portrait = innerHeight > innerWidth;
  const avail = portrait ? innerHeight * 0.78 : innerHeight;     // leave room for controls in portrait
  TS = Math.floor(Math.min(avail / ROWS, innerWidth / 11));
  viewCols = innerWidth / TS;
  offY = portrait ? (avail - ROWS * TS) * 0.5 : innerHeight - ROWS * TS;
}
function draw() {
  const s = dpr;
  g.setTransform(s, 0, 0, s, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, innerHeight);
  sky.addColorStop(0, '#5c94fc'); sky.addColorStop(1, '#a8d8ff');
  g.fillStyle = sky; g.fillRect(0, 0, innerWidth, innerHeight);
  // parallax hills and clouds
  for (let i = -1; i < viewCols / 6 + 2; i++) {
    const hx = (i * 6 - (camX * 0.3) % 6) * TS, base = offY + GROUND * TS;
    g.fillStyle = '#7ccf6b'; g.beginPath(); g.ellipse(hx + TS * 2, base, TS * 3, TS * 2.2, 0, Math.PI, 0); g.fill();
    const cx = (i * 9 - (camX * 0.15) % 9) * TS, cy = offY + TS * (2 + (i & 1));
    g.fillStyle = '#ffffffd0';
    [[0, 0, 1], [0.9, -0.35, 1.1], [1.9, 0, 0.9]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(cx + dx * TS, cy + dy * TS, r * TS * 0.6, 0, 7); g.fill(); });
  }
  g.save();
  g.translate(-camX * TS, offY);
  const x0 = Math.floor(camX), x1 = Math.ceil(camX + viewCols) + 1;
  for (let y = 0; y < ROWS; y++) for (let x = x0; x <= x1; x++) {
    const t = tileAt(x, y); if (!t || x >= W) continue;
    drawTile(t, x * TS, y * TS, x, y);
  }
  // flag + castle
  const fx = flagX * TS + TS / 2;
  g.fillStyle = '#ddd'; g.fillRect(fx - 3, (GROUND - 10) * TS, 6, 9 * TS);
  g.fillStyle = '#22c55e'; g.beginPath(); g.moveTo(fx - 3, (GROUND - 10) * TS + 6); g.lineTo(fx - TS * 1.4, (GROUND - 9.4) * TS); g.lineTo(fx - 3, (GROUND - 8.8) * TS); g.fill();
  g.fillStyle = '#fbbf24'; g.beginPath(); g.arc(fx, (GROUND - 10) * TS, 7, 0, 7); g.fill();
  const cxs = (flagX + 4) * TS, cys = (GROUND - 5) * TS;
  g.fillStyle = '#b45309'; g.fillRect(cxs, cys, TS * 5, TS * 5);
  for (let i = 0; i < 5; i += 2) g.fillRect(cxs + i * TS, cys - TS * 0.6, TS, TS * 0.6);
  g.fillStyle = '#1f1308'; g.beginPath(); g.arc(cxs + TS * 2.5, cys + TS * 5, TS * 1.1, Math.PI, 0); g.fill();
  // coins
  coins.forEach((c) => { if (!c.got) drawCoin(c.x * TS + TS / 2, c.y * TS + TS / 2); });
  items.forEach((it) => drawAcorn(it.x * TS, it.y * TS, it.w * TS));
  enemies.forEach((e) => drawEnemy(e));
  particles.forEach((p) => {
    if (p.kind === 'coin') drawCoin(p.x * TS, p.y * TS);
    else { g.fillStyle = '#c2410c'; g.fillRect(p.x * TS - TS * 0.2, p.y * TS - TS * 0.2, TS * 0.4, TS * 0.4); }
  });
  drawPlayer();
  g.restore();
  // portrait ground filler under the world
  if (innerHeight > innerWidth) { g.fillStyle = '#3b2a1a'; g.fillRect(0, offY + ROWS * TS, innerWidth, innerHeight); }
}
function drawTile(t, px, py, x, y) {
  const s = TS;
  if (t === SOLID) {
    const top = !solid(tileAt(x, y - 1));
    g.fillStyle = '#c0712f'; g.fillRect(px, py, s, s);
    g.fillStyle = '#9a5520'; g.fillRect(px + s * 0.1, py + s * 0.55, s * 0.35, s * 0.3); g.fillRect(px + s * 0.55, py + s * 0.15, s * 0.35, s * 0.3);
    if (top) { g.fillStyle = '#4caf50'; g.fillRect(px, py, s, s * 0.28); g.fillStyle = '#2e7d32'; g.fillRect(px, py + s * 0.24, s, s * 0.06); }
  } else if (t === BRICK) {
    g.fillStyle = '#c2410c'; g.fillRect(px, py, s, s);
    g.fillStyle = '#7c2d12';
    g.fillRect(px, py + s / 2 - 1, s, 2); g.fillRect(px + s / 2 - 1, py, 2, s / 2); g.fillRect(px + s / 4 - 1, py + s / 2, 2, s / 2); g.fillRect(px + s * 0.75 - 1, py + s / 2, 2, s / 2);
  } else if (t === QBLOCK || t === USED) {
    g.fillStyle = t === QBLOCK ? '#f59e0b' : '#92400e'; g.fillRect(px + 1, py + 1, s - 2, s - 2);
    g.strokeStyle = '#78350f'; g.lineWidth = 2; g.strokeRect(px + 1, py + 1, s - 2, s - 2);
    if (t === QBLOCK) { g.fillStyle = '#fff7ed'; g.font = `900 ${s * 0.7}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', px + s / 2, py + s / 2 + Math.sin(time * 5) * 1.5); }
  } else if (t === PIPE) {
    const leftHalf = tileAt(x - 1, y) !== PIPE, topRow = tileAt(x, y - 1) !== PIPE;
    g.fillStyle = '#16a34a'; g.fillRect(px, py, s, s);
    g.fillStyle = leftHalf ? '#4ade80' : '#15803d'; g.fillRect(px + (leftHalf ? s * 0.15 : s * 0.6), py, s * 0.2, s);
    if (topRow) { g.fillStyle = '#22c55e'; g.fillRect(px - (leftHalf ? s * 0.12 : 0), py, s * 1.12, s * 0.45); g.strokeStyle = '#14532d'; g.strokeRect(px - (leftHalf ? s * 0.12 : 0), py, s * 1.12, s * 0.45); }
  } else if (t === STONE) {
    g.fillStyle = '#a16207'; g.fillRect(px, py, s, s); g.fillStyle = '#ca8a04'; g.fillRect(px + 2, py + 2, s - 6, s - 6); g.fillStyle = '#713f12'; g.fillRect(px + s - 4, py + 2, 2, s - 4);
  }
}
function drawCoin(cx, cy) {
  const w = Math.abs(Math.sin(time * 4 + cx * 0.05)) * TS * 0.3 + 2;
  g.fillStyle = '#fbbf24'; g.beginPath(); g.ellipse(cx, cy, w, TS * 0.38, 0, 0, 7); g.fill();
  g.fillStyle = '#fde68a'; g.beginPath(); g.ellipse(cx, cy, w * 0.45, TS * 0.22, 0, 0, 7); g.fill();
}
function drawAcorn(px, py, s) {
  g.fillStyle = '#d97706'; g.beginPath(); g.ellipse(px + s / 2, py + s * 0.62, s * 0.42, s * 0.4, 0, 0, 7); g.fill();
  g.fillStyle = '#78350f'; g.beginPath(); g.ellipse(px + s / 2, py + s * 0.32, s * 0.5, s * 0.26, 0, Math.PI, 0); g.fill(); g.fillRect(px + s * 0.46, py, s * 0.08, s * 0.12);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(px + s * 0.38, py + s * 0.6, s * 0.08, 0, 7); g.arc(px + s * 0.62, py + s * 0.6, s * 0.08, 0, 7); g.fill();
}
function drawEnemy(e) {
  if (!e.alive && e.timer <= 0) return;
  const flipped = !e.alive && e.death === 'flip';
  // A flipped enemy falls off the screen; the offset grows as its timer runs out.
  const fall = flipped ? (1 - e.timer) * (1 - e.timer) * 12 - (1 - e.timer) * 3 : 0;
  const px = e.x * TS, py = (e.y + fall) * TS, w = e.w * TS, h = e.h * TS;
  g.save();
  if (flipped) { g.translate(px + w / 2, py + h / 2); g.scale(1, -1); g.translate(-px - w / 2, -py - h / 2); }
  const squashed = !e.alive && e.death === 'squash';
  const hh = squashed ? h * 0.35 : h;
  const top = py + h - hh;
  g.fillStyle = e.kind === 'fast' ? '#7c3aed' : '#8b4513';
  g.beginPath(); g.ellipse(px + w / 2, top + hh * 0.45, w * 0.55, hh * 0.5, 0, Math.PI, 0); g.lineTo(px + w, top + hh * 0.75); g.lineTo(px, top + hh * 0.75); g.fill();
  if (!squashed) {
    g.fillStyle = '#fff'; g.fillRect(px + w * 0.2, top + hh * 0.3, w * 0.22, hh * 0.25); g.fillRect(px + w * 0.58, top + hh * 0.3, w * 0.22, hh * 0.25);
    g.fillStyle = '#000'; g.fillRect(px + w * 0.27, top + hh * 0.36, w * 0.1, hh * 0.15); g.fillRect(px + w * 0.63, top + hh * 0.36, w * 0.1, hh * 0.15);
    const step = Math.sin(time * 12 + e.x) > 0 ? 0.1 : 0;
    g.fillStyle = '#1c1917'; g.fillRect(px + w * (0.08 + step), top + hh * 0.75, w * 0.32, hh * 0.25); g.fillRect(px + w * (0.6 - step), top + hh * 0.75, w * 0.32, hh * 0.25);
  }
  g.restore();
}
function drawPlayer() {
  if (P.inv > 0 && Math.floor(P.inv * 12) % 2 && !P.dead) return;
  const px = P.x * TS, py = P.y * TS, w = P.w * TS, h = P.h * TS;
  g.save();
  g.translate(px + w / 2, py); g.scale(P.face, 1); g.translate(-w / 2, 0);
  const run = P.onGround && Math.abs(P.vx) > 0.5 ? Math.sin(time * 20) : 0;
  // legs
  g.fillStyle = '#1e3a8a';
  g.fillRect(w * 0.12, h * 0.72 + run * 2, w * 0.3, h * 0.28 - run * 2); g.fillRect(w * 0.58, h * 0.72 - run * 2, w * 0.3, h * 0.28 + run * 2);
  // overalls + shirt
  g.fillStyle = '#ef4444'; g.fillRect(w * 0.05, h * 0.42, w * 0.9, h * 0.22);
  g.fillStyle = '#2563eb'; g.fillRect(w * 0.12, h * 0.52, w * 0.76, h * 0.24);
  g.fillStyle = '#fde047'; g.fillRect(w * 0.25, h * 0.55, w * 0.1, w * 0.1); g.fillRect(w * 0.65, h * 0.55, w * 0.1, w * 0.1);
  // head
  g.fillStyle = '#fcd5b5'; g.beginPath(); g.arc(w * 0.52, h * 0.27, w * 0.38, 0, 7); g.fill();
  g.fillStyle = '#ef4444'; g.beginPath(); g.ellipse(w * 0.48, h * 0.16, w * 0.46, h * 0.1, 0, Math.PI, 0); g.fill(); g.fillRect(w * 0.48, h * 0.13, w * 0.5, h * 0.05);
  g.fillStyle = '#fff'; g.font = `900 ${w * 0.32}px system-ui`; g.textAlign = 'center'; g.fillText('M', w * 0.45, h * 0.15);
  g.fillStyle = '#111'; g.beginPath(); g.arc(w * 0.66, h * 0.26, w * 0.06, 0, 7); g.fill();
  g.fillStyle = '#5b3a1e'; g.fillRect(w * 0.55, h * 0.33, w * 0.32, h * 0.04);
  g.restore();
}

// ---------- Game flow ----------
function hud() {
  document.getElementById('hLives').textContent = '❤️ ' + lives;
  document.getElementById('hCoins').textContent = '🪙 ' + coinCount;
  document.getElementById('hLevel').textContent = '🌍 ' + level;
  document.getElementById('hScore').textContent = score.toLocaleString();
}
const overlay = document.getElementById('overlay');
function showOverlay(text, btn, cb) {
  document.getElementById('oText').textContent = text;
  document.getElementById('oBest').textContent = best ? `🏆 ${T('Best', 'Récord')}: ${best.toLocaleString()}` : '';
  const b = document.getElementById('oBtn'); b.textContent = btn; b.onclick = cb;
  overlay.classList.remove('hide');
}
function startGame() {
  lives = 3; coinCount = 0; score = 0; level = 1; time = 0; P.big = false;
  buildLevel(level); resetPlayer(); state = 'play'; overlay.classList.add('hide'); beep(1, 1, 0.01, 'sine', 0.001);
}
function saveBest() { if (score > best) { best = score; kv.set('best', best); } }
function gameOver() {
  state = 'over'; saveBest();
  showOverlay(`${T('Game over', 'Fin de la partida')} · ${T('level', 'nivel')} ${level} · ${score.toLocaleString()} ${T('points', 'puntos')}`, T('Play again', 'Jugar otra vez'), startGame);
}
document.getElementById('pauseBtn').onclick = () => {
  if (state !== 'play') return;
  state = 'pause';
  showOverlay(T('Paused', 'Pausa'), T('Continue', 'Continuar'), () => { state = 'play'; overlay.classList.add('hide'); });
};
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') document.getElementById('pauseBtn').click(); });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); hud(); }
  draw();
  requestAnimationFrame(loop);
}
addEventListener('resize', resize);
(async () => {
  best = await kv.get('best', 0);
  resize(); buildLevel(1); resetPlayer();
  showOverlay(T('Run, jump on enemies, grab coins and reach the flag. Levels get harder!', 'Corre, salta sobre los enemigos, coge monedas y llega a la bandera. ¡Cada nivel es más difícil!'), T('Play', 'Jugar'), startGame);
  requestAnimationFrame(loop);
})();
</script>
