<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Calculator</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --key: #1b2333; --key-hi: #253046; --text: #eef2f8; --muted: #8a94a8;
    --op: #ff9f2e; --op-text: #1a1206; --fn: #2c3750; --accent: #4fd1c5;
    --gap: clamp(8px, 2.2vmin, 14px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  .app { height: 100dvh; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 14px);
    gap: var(--gap); max-width: 560px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; min-height: 40px; }
  .icon-btn { background: var(--panel); border: 0; color: var(--text); width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center; font-size: 20px; }
  .icon-btn:active { transform: scale(.94); }
  .title { color: var(--muted); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .display { flex: 1 1 auto; min-height: 90px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    padding: 4px 6px; overflow: hidden; }
  .expr { color: var(--muted); font-size: clamp(18px, 4.6vmin, 26px); white-space: nowrap; overflow-x: auto; max-width: 100%;
    scrollbar-width: none; direction: rtl; text-align: right; min-height: 1.3em; }
  .expr::-webkit-scrollbar { display: none; }
  .expr span { direction: ltr; unicode-bidi: bidi-override; }
  .main { font-weight: 300; line-height: 1.05; white-space: nowrap; max-width: 100%; font-variant-numeric: tabular-nums;
    transition: font-size .12s; }
  .main.error { color: #ff6b6b; font-size: clamp(26px, 7vmin, 40px) !important; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); flex: 0 0 auto;
    height: min(62dvh, 125vw); }
  .key { border: 0; border-radius: 22px; background: var(--key); color: var(--text); font-size: clamp(22px, 5.4vmin, 32px);
    font-family: inherit; transition: transform .06s, background .15s; touch-action: manipulation; }
  .key:active, .key.pressed { transform: scale(.95); background: var(--key-hi); }
  .key.fn { background: var(--fn); color: var(--accent); font-size: clamp(18px, 4.6vmin, 26px); }
  .key.op { background: var(--op); color: var(--op-text); font-weight: 600; }
  .key.op.active { background: #fff; color: var(--op); }
  .key.eq { background: linear-gradient(135deg, #ffb347, #ff7a18); color: var(--op-text); font-weight: 700; }
  .left { display: contents; }
  @media (orientation: landscape) and (max-height: 520px) {
    .app { max-width: none; flex-direction: row; }
    .left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .keys { height: auto; flex: 1.2; grid-template-rows: repeat(5, 1fr); }
    .key { border-radius: 16px; }
  }
  /* History sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75dvh; background: var(--panel); border-radius: 24px 24px 0 0;
    transform: translateY(105%); transition: transform .25s ease; display: flex; flex-direction: column;
    padding: 16px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px); max-width: 640px; margin: 0 auto; }
  .open .sheet { transform: none; } .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .sheet h2 { margin: 0 0 8px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { background: none; border: 0; color: #ff6b6b; font-size: 15px; }
  .list { overflow-y: auto; }
  .item { padding: 12px 6px; border-bottom: 1px solid #ffffff10; text-align: right; }
  .item:active { background: #ffffff08; }
  .item .e { color: var(--muted); font-size: 15px; word-break: break-all; }
  .item .r { font-size: 24px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="left">
    <div class="top">
      <button class="icon-btn" id="histBtn" aria-label="History">🕘</button>
      <div class="title" id="title">Calculator</div>
      <button class="icon-btn" id="copyBtn" aria-label="Copy">⧉</button>
    </div>
    <div class="display" id="display">
      <div class="expr" id="expr"><span></span></div>
      <div class="main" id="main">0</div>
    </div>
  </div>
  <div class="keys" id="keys"></div>
</div>
<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet">
    <h2><span id="histTitle">History</span><button id="clearHist">Clear</button></h2>
    <div class="list" id="list"></div>
  </div>
</div>
<script>
const ES = (navigator.language || '').toLowerCase().startsWith('es');
const T = (en, es) => (ES ? es : en);
const buzz = (ms) => { try { window.Acornix ? Acornix.vibrate(ms) : navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function coll(name) {
  if (window.Acornix) return Acornix.db.collection(name);
  const key = 'calc:' + name;
  const read = () => { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; } };
  const write = (a) => localStorage.setItem(key, JSON.stringify(a));
  return {
    async add(d) { const a = read(); const doc = { ...d, _id: Math.random().toString(36).slice(2), _created: Date.now() }; a.push(doc); write(a); return doc; },
    async list(q = {}) { let a = read(); if (q.desc) a.reverse(); if (q.limit) a = a.slice(0, q.limit); return a; },
    async remove(id) { write(read().filter((d) => d._id !== id)); return true; },
    async clear() { write([]); return true; },
  };
}
const history = coll('history');

document.getElementById('title').textContent = T('Calculator', 'Calculadora');
document.getElementById('histTitle').textContent = T('History', 'Historial');
document.getElementById('clearHist').textContent = T('Clear', 'Borrar');

const DEC = ES ? ',' : '.';
const KEYS = [
  ['AC', 'fn', 'clear'], ['⌫', 'fn', 'back'], ['%', 'fn', 'percent'], ['÷', 'op', '/'],
  ['7', '', '7'], ['8', '', '8'], ['9', '', '9'], ['×', 'op', '*'],
  ['4', '', '4'], ['5', '', '5'], ['6', '', '6'], ['−', 'op', '-'],
  ['1', '', '1'], ['2', '', '2'], ['3', '', '3'], ['+', 'op', '+'],
  ['±', 'fn', 'neg'], ['0', '', '0'], [DEC, '', '.'], ['=', 'eq', '='],
];
const keysEl = document.getElementById('keys');
KEYS.forEach(([label, cls, action]) => {
  const b = document.createElement('button');
  b.className = 'key ' + cls;
  b.textContent = label;
  b.dataset.action = action;
  keysEl.appendChild(b);
});

// State: a list of tokens: numbers as strings, operators as '+', '-', '*', '/'
let tokens = ['0'];
let justEvaluated = false;
let errorState = false;

const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const isOp = (t) => t in SYM;
const last = () => tokens[tokens.length - 1];

function formatNumber(str) {
  if (str === '' || str === '-') return str || '0';
  const neg = str.startsWith('-');
  let [int, frac] = str.replace('-', '').split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ES ? '.' : ',');
  return (neg ? '-' : '') + int + (frac !== undefined ? DEC + frac : '');
}
function formatResult(n) {
  if (!isFinite(n)) return null;
  if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)) {
    return n.toExponential(8).replace(/\.?0+e/, 'e').replace('.', DEC);
  }
  const s = String(parseFloat(n.toPrecision(12)));
  return formatNumber(s);
}

// Shunting-yard evaluation (no eval)
function evaluate(toks) {
  const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  const out = [], ops = [];
  for (const t of toks) {
    if (isOp(t)) {
      while (ops.length && prec[ops[ops.length - 1]] >= prec[t]) out.push(ops.pop());
      ops.push(t);
    } else out.push(parseFloat(t));
  }
  while (ops.length) out.push(ops.pop());
  const st = [];
  for (const t of out) {
    if (typeof t === 'number') { st.push(t); continue; }
    const b = st.pop(), a = st.pop();
    if (t === '/' && b === 0) throw new Error('div0');
    st.push(t === '+' ? a + b : t === '-' ? a - b : t === '*' ? a * b : a / b);
  }
  return st[0];
}
function cleanTokens() {
  const t = tokens.slice();
  if (isOp(t[t.length - 1])) t.pop();
  return t.map((x) => (x === '-' || x === '' ? '0' : x.endsWith('.') ? x.slice(0, -1) : x));
}

const exprEl = document.querySelector('#expr span');
const mainEl = document.getElementById('main');
function render() {
  document.querySelectorAll('.key.op').forEach((k) => k.classList.toggle('active', isOp(last()) && k.dataset.action === last()));
  if (errorState) return;
  const exprText = tokens.map((t) => (isOp(t) ? ` ${SYM[t]} ` : formatNumber(t))).join('');
  let preview = '';
  if (tokens.length > 1) {
    try { const v = evaluate(cleanTokens()); preview = formatResult(v) ?? ''; } catch (e) { preview = ''; }
  }
  exprEl.textContent = tokens.length > 1 ? exprText : '';
  const current = isOp(last()) ? tokens[tokens.length - 2] : last();
  const big = justEvaluated ? formatNumber(last()) : (tokens.length > 1 && preview ? preview : formatNumber(current));
  mainEl.textContent = big;
  mainEl.classList.remove('error');
  fit();
}
function fit() {
  const w = document.getElementById('display').clientWidth - 12;
  let size = Math.min(96, Math.max(36, window.innerHeight * 0.11));
  mainEl.style.fontSize = size + 'px';
  while (mainEl.scrollWidth > w && size > 20) { size -= 2; mainEl.style.fontSize = size + 'px'; }
}
function showError(msg) {
  errorState = true;
  mainEl.textContent = msg;
  mainEl.classList.add('error');
}

function press(action) {
  buzz(8);
  if (errorState && action !== 'clear') { errorState = false; tokens = ['0']; }
  const cur = last();
  if (/^\d$/.test(action)) {
    if (justEvaluated) { tokens = ['0']; justEvaluated = false; }
    if (isOp(last())) tokens.push(action);
    else {
      const digits = last().replace(/[-.]/g, '');
      if (digits.length >= 15) return;
      tokens[tokens.length - 1] = last() === '0' ? action : last() === '-0' ? '-' + action : last() + action;
    }
  } else if (action === '.') {
    if (justEvaluated) { tokens = ['0']; justEvaluated = false; }
    if (isOp(cur)) tokens.push('0.');
    else if (!cur.includes('.')) tokens[tokens.length - 1] = cur + '.';
  } else if (isOp(action)) {
    justEvaluated = false;
    if (isOp(cur)) tokens[tokens.length - 1] = action;
    else tokens.push(action);
  } else if (action === 'clear') {
    tokens = ['0']; justEvaluated = false; errorState = false;
  } else if (action === 'back') {
    if (justEvaluated) { tokens = ['0']; justEvaluated = false; }
    else if (isOp(cur)) tokens.pop();
    else {
      const s = cur.slice(0, -1);
      if (s === '' || s === '-') { if (tokens.length > 1) tokens.pop(); else tokens = ['0']; }
      else tokens[tokens.length - 1] = s;
    }
  } else if (action === 'neg') {
    const i = isOp(cur) ? -1 : tokens.length - 1;
    if (i < 0) return;
    tokens[i] = tokens[i].startsWith('-') ? tokens[i].slice(1) : '-' + tokens[i];
    justEvaluated = false;
  } else if (action === 'percent') {
    if (isOp(cur)) return;
    const n = parseFloat(cur) / 100;
    tokens[tokens.length - 1] = String(parseFloat(n.toPrecision(12)));
  } else if (action === '=') {
    if (tokens.length < 2) return;
    const clean = cleanTokens();
    if (clean.length < 2) { tokens = clean; justEvaluated = true; render(); return; }
    const exprText = clean.map((t) => (isOp(t) ? ` ${SYM[t]} ` : formatNumber(t))).join('');
    try {
      const v = evaluate(clean);
      const shown = formatResult(v);
      if (shown === null) throw new Error('nan');
      tokens = [String(parseFloat(v.toPrecision(12)))];
      justEvaluated = true;
      exprEl.textContent = exprText + ' =';
      mainEl.textContent = shown;
      mainEl.classList.remove('error');
      fit();
      history.add({ expr: exprText, result: shown, value: v }).catch(() => {});
      document.querySelectorAll('.key.op').forEach((k) => k.classList.remove('active'));
      return;
    } catch (e) {
      showError(e.message === 'div0' ? T("Can't divide by 0", 'No se puede dividir entre 0') : T('Error', 'Error'));
      return;
    }
  }
  render();
}

keysEl.addEventListener('pointerdown', (e) => {
  const k = e.target.closest('.key');
  if (!k) return;
  e.preventDefault();
  press(k.dataset.action);
});
document.addEventListener('keydown', (e) => {
  const map = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'clear', '%': 'percent', ',': '.', '.': '.', '+': '+', '-': '-', '*': '*', x: '*', '/': '/' };
  const a = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (a) { e.preventDefault(); press(a); }
});

// Copy result
document.getElementById('copyBtn').onclick = async () => {
  const text = mainEl.textContent;
  try { window.Acornix ? await Acornix.copy(text) : await navigator.clipboard.writeText(text); } catch (e) {}
  try { window.Acornix && Acornix.toast(T('Copied', 'Copiado')); } catch (e) {}
  buzz(15);
};

// History sheet
const wrap = document.getElementById('sheetWrap');
async function openHistory() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  let items = [];
  try { items = await history.list({ orderBy: '_created', desc: true, limit: 100 }); } catch (e) {}
  if (!items.length) list.innerHTML = `<div class="empty">${T('No calculations yet', 'Aún no hay cálculos')}</div>`;
  items.forEach((it) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<div class="e"></div><div class="r"></div>`;
    d.querySelector('.e').textContent = it.expr + ' =';
    d.querySelector('.r').textContent = it.result;
    d.onclick = () => {
      tokens = [String(it.value)]; justEvaluated = true; errorState = false;
      exprEl.textContent = ''; render(); wrap.classList.remove('open');
    };
    list.appendChild(d);
  });
  wrap.classList.add('open');
}
document.getElementById('histBtn').onclick = openHistory;
document.getElementById('sheetBg').onclick = () => wrap.classList.remove('open');
document.getElementById('clearHist').onclick = async () => { try { await history.clear(); } catch (e) {} openHistory(); };

window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
